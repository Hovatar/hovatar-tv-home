<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HOVATAR</title>
<style>
  /* ============================================================
     HOVATAR launcher for Samsung Tizen 4.0 (Chromium ~M56, 2018).
     Compatibility notes baked in:
       - NO clamp()/min()/max()  (unsupported on M56) -> vw/vh + media queries
       - NO aspect-ratio          -> padding-top ratio hack
       - NO grid gap dependence   -> spacing via padding on grid cells
       - NO 'inset' shorthand     -> explicit top/right/bottom/left:0
       - -webkit- prefixes for transform / animation / clip-path / mask
       - var()/calc() are fine on M56; JS avoids ?. and ??
     ============================================================ */

  :root{
    --bg:#000;
    --fg:#f5f6f8;
    --muted:#8c8c96;
    --gap:24px;
  }
  @media (max-width:1300px){ :root{ --gap:16px; } }
  @media (min-width:2200px){ :root{ --gap:38px; } }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; width:100%; overflow:hidden;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{ cursor:default; }

  /* ============================================================
     1) BOOT SEQUENCE  (~5s laser-draw of HOVATAR)
     ============================================================ */
  #intro{
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:50;
    background:#000; display:-webkit-flex; display:flex;
    -webkit-align-items:center; align-items:center;
    -webkit-justify-content:center; justify-content:center;
    overflow:hidden;
  }
  /* faint volumetric haze so the beam feels like it lives in a space */
  #intro .haze{
    position:absolute; top:0; right:0; bottom:0; left:0;
    background:radial-gradient(60% 50% at 50% 50%, rgba(80,110,210,.10), rgba(0,0,0,0) 70%);
    opacity:0;
    -webkit-animation:haze 3.4s ease .5s forwards; animation:haze 3.4s ease .5s forwards;
  }
  @-webkit-keyframes haze{0%{opacity:0}30%{opacity:1}100%{opacity:.35}}
  @keyframes haze{0%{opacity:0}30%{opacity:1}100%{opacity:.35}}

  #intro.done{ -webkit-animation:introOut .7s ease forwards; animation:introOut .7s ease forwards; }
  @-webkit-keyframes introOut{to{opacity:0;visibility:hidden}}
  @keyframes introOut{to{opacity:0;visibility:hidden}}

  .stage{ position:relative; display:-webkit-inline-flex; display:inline-flex;
    -webkit-align-items:center; align-items:center; }

  .wordmark{
    position:relative; z-index:2;
    font-weight:800; letter-spacing:.14em; line-height:1; white-space:nowrap;
    font-size:9.2vw;
    color:transparent;
    background:-webkit-linear-gradient(left,#ffffff,#eaf0ff 60%,#cdd8ff);
    background:linear-gradient(90deg,#ffffff,#eaf0ff 60%,#cdd8ff);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.05);
    /* hidden, then "painted" left -> right in sync with the beam */
    -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0);
    -webkit-animation:reveal 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards,
                      settle 2.4s ease 2.5s forwards;
            animation:reveal 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards,
                      settle 2.4s ease 2.5s forwards;
  }
  @-webkit-keyframes reveal{to{-webkit-clip-path:inset(0 0 0 0)}}
  @keyframes reveal{to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}}
  /* the ignite + glow settle after the beam has passed */
  @-webkit-keyframes settle{
    0%{text-shadow:0 0 18px rgba(200,215,255,.95),0 0 60px rgba(150,185,255,.55)}
    100%{text-shadow:0 0 16px rgba(190,205,255,.30)}
  }
  @keyframes settle{
    0%{text-shadow:0 0 18px rgba(200,215,255,.95),0 0 60px rgba(150,185,255,.55)}
    100%{text-shadow:0 0 16px rgba(190,205,255,.30)}
  }

  /* subtitle fades up once the word is lit */
  .introsub{
    position:absolute; left:0; right:0; bottom:-14%; text-align:center;
    color:#9fb0d8; font-size:1.3vw; letter-spacing:.55em; text-transform:uppercase;
    opacity:0; text-indent:.55em;
    -webkit-animation:subIn 1s ease 2.9s forwards; animation:subIn 1s ease 2.9s forwards;
  }
  @-webkit-keyframes subIn{from{opacity:0;-webkit-transform:translateY(8px)}to{opacity:.85;-webkit-transform:translateY(0)}}
  @keyframes subIn{from{opacity:0;transform:translateY(8px)}to{opacity:.85;transform:translateY(0)}}

  /* the laser beam that rides across and "draws" the letters.
     Driven by `left` (0%..100% of the wordmark box) so the beam head
     tracks the reveal edge exactly, whatever the rendered word width. */
  .beam{
    position:absolute; top:-30%; height:160%; width:3px; left:0; z-index:3;
    margin-left:-1.5px;
    background:-webkit-linear-gradient(top,rgba(255,255,255,0),#fff 16%,#fff 84%,rgba(255,255,255,0));
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff 16%,#fff 84%,rgba(255,255,255,0));
    -webkit-box-shadow:0 0 16px 5px rgba(255,255,255,.95),0 0 46px 14px rgba(150,190,255,.7);
            box-shadow:0 0 16px 5px rgba(255,255,255,.95),0 0 46px 14px rgba(150,190,255,.7);
    opacity:0;
    -webkit-animation:sweep 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards;
            animation:sweep 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards;
  }
  @-webkit-keyframes sweep{
    0%{left:-2%;opacity:0}6%{opacity:1}88%{opacity:1}100%{left:102%;opacity:0}
  }
  @keyframes sweep{
    0%{left:-2%;opacity:0}6%{opacity:1}88%{opacity:1}100%{left:102%;opacity:0}
  }

  /* bright lens-flare core that rides the beam head */
  .flare{
    position:absolute; top:50%; left:0; z-index:3;
    width:16vw; height:16vw; margin:-8vw 0 0 -8vw;
    border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(170,200,255,.4) 32%, rgba(0,0,0,0) 62%);
    mix-blend-mode:screen;
    -webkit-animation:flareMove 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards;
            animation:flareMove 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards;
  }
  @-webkit-keyframes flareMove{0%{left:-2%;opacity:0}8%{opacity:1}85%{opacity:.9}100%{left:102%;opacity:0}}
  @keyframes flareMove{0%{left:-2%;opacity:0}8%{opacity:1}85%{opacity:.9}100%{left:102%;opacity:0}}

  /* horizontal anamorphic streak on the flare core */
  .streak{
    position:absolute; top:50%; left:0; z-index:3;
    width:30vw; height:2px; margin:-1px 0 0 -15vw;
    background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(190,215,255,.85),rgba(255,255,255,0));
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(190,215,255,.85),rgba(255,255,255,0));
    mix-blend-mode:screen; opacity:0;
    -webkit-animation:flareMove 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards;
            animation:flareMove 2.25s cubic-bezier(.62,.03,.2,1) .45s forwards;
  }

  /* ============================================================
     2) HOME SCREEN
     ============================================================ */
  #home{
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:10;
    padding:4.4vh 4.6vw; display:-webkit-flex; display:flex;
    -webkit-flex-direction:column; flex-direction:column;
    opacity:0; -webkit-transition:opacity .7s ease; transition:opacity .7s ease;
    background:
      radial-gradient(1200px 620px at 86% -12%, rgba(64,86,170,.18), rgba(0,0,0,0) 60%),
      radial-gradient(900px 520px at -4% 112%, rgba(120,64,168,.14), rgba(0,0,0,0) 55%),
      #000;
  }
  #home.show{ opacity:1; }

  .topbar{
    display:-webkit-flex; display:flex;
    -webkit-align-items:flex-end; align-items:flex-end;
    -webkit-justify-content:space-between; justify-content:space-between;
    margin-bottom:3.6vh;
  }
  .hello{ font-size:2.2vw; font-weight:600; letter-spacing:.005em; }
  .hello .sub{ display:block; color:var(--muted); font-weight:500;
    font-size:.95vw; margin-top:.7em; letter-spacing:.22em; text-transform:uppercase; }
  .clock{ text-align:right; }
  .clock .t{ font-size:2.7vw; font-weight:700; }
  .clock .d{ color:var(--muted); font-size:1.05vw; letter-spacing:.05em; margin-top:.35em; }

  .grid{
    display:grid; grid-template-columns:repeat(5,1fr);
    -webkit-align-content:start; align-content:start;
    -webkit-flex:1; flex:1; overflow:hidden;
    margin:0 calc(var(--gap)/-2);   /* offset the cell padding at the edges */
  }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(3,1fr); } }

  .cell{
    padding:calc(var(--gap)/2);        /* spacing WITHOUT relying on grid gap */
    outline:none; -webkit-tap-highlight-color:transparent;
  }

  /* padding-top ratio hack = tile aspect without aspect-ratio */
  .tile{
    position:relative; width:100%; height:0; padding-top:58%;
    border-radius:16px; overflow:hidden;
    background:#141418; border:1px solid rgba(255,255,255,.06);
    -webkit-transition:-webkit-transform .18s ease, box-shadow .2s ease, border-color .2s ease;
            transition:transform .18s ease, box-shadow .2s ease, border-color .2s ease;
    will-change:transform;
  }
  .tile .skin{ position:absolute; top:0; right:0; bottom:0; left:0; }
  .tile .sheen{ position:absolute; top:0; right:0; bottom:0; left:0;
    background:-webkit-linear-gradient(top,rgba(255,255,255,.10),rgba(255,255,255,0) 45%);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%);
    opacity:.6; }
  .tile .art{ position:absolute; top:0; right:0; bottom:0; left:0;
    display:-webkit-flex; display:flex;
    -webkit-align-items:center; align-items:center;
    -webkit-justify-content:center; justify-content:center; }
  .tile .logo{ width:70%; height:58%;
    display:-webkit-flex; display:flex;
    -webkit-align-items:center; align-items:center;
    -webkit-justify-content:center; justify-content:center; }
  .tile .logo svg{ display:block; width:100%; height:100%; }

  .label{ margin-top:.75vh; text-align:center; color:var(--muted);
    font-size:1.0vw; font-weight:600; letter-spacing:.02em;
    -webkit-transition:color .18s ease; transition:color .18s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* strong, premium TV focus state */
  .cell:focus .tile, .cell.sel .tile{
    border-color:rgba(255,255,255,.95);
    -webkit-transform:translateY(-6px) scale(1.055);
            transform:translateY(-6px) scale(1.055);
    -webkit-box-shadow:0 0 0 3px rgba(255,255,255,.96),
                       0 22px 60px -14px rgba(0,0,0,.8),
                       0 0 46px -4px var(--glow,#4466ff);
            box-shadow:0 0 0 3px rgba(255,255,255,.96),
                       0 22px 60px -14px rgba(0,0,0,.8),
                       0 0 46px -4px var(--glow,#4466ff);
  }
  .cell:focus .label, .cell.sel .label{ color:#fff; }

  .footer{
    margin-top:3vh; display:-webkit-flex; display:flex;
    color:var(--muted); font-size:1.0vw; letter-spacing:.04em;
  }
  .footer span{ margin-right:2.2vw; }
  .footer b{ color:var(--fg); font-weight:600; }
  .kbd{ display:inline-block; min-width:1.5em; text-align:center;
    border:1px solid #333; border-radius:6px; padding:.06em .45em;
    color:#d2d2da; margin-right:.3em; font-weight:600; }

  /* launch toast (desktop preview / Tizen error) */
  #flash{
    position:fixed; left:50%; bottom:9%; -webkit-transform:translateX(-50%);
    transform:translateX(-50%); z-index:60;
    background:rgba(20,20,26,.94); border:1px solid rgba(255,255,255,.14); color:#fff;
    padding:.8em 1.4em; border-radius:14px; font-size:1.25vw;
    -webkit-box-shadow:0 14px 44px rgba(0,0,0,.6); box-shadow:0 14px 44px rgba(0,0,0,.6);
    opacity:0; -webkit-transition:opacity .25s ease; transition:opacity .25s ease;
    pointer-events:none;
  }
</style>
</head>

  <div id="intro">

    <div class="stage">

      <div class="streak"></div>
      <div class="flare"></div>
      <div class="beam"></div>
    </div>

  <!-- ===================== HOME SCREEN ===================== -->
  <div id="home">
    <div class="topbar">

      <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>

    <div class="grid" id="grid"></div>
    <div class="footer">
      <span><b class="kbd">&#9664;</b><b class="kbd">&#9654;</b><b class="kbd">&#9650;</b><b class="kbd">&#9660;</b> Move</span>

    </div>
  </div>

  <div id="flash"></div>

   bg:"linear-gradient(135deg,#17336e,#0a1a40)"}
];

/* ---- build the grid ---- */
var grid = document.getElementById('grid');
var i;
for(i=0;i<APPS.length;i++){
  (function(a){
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.tabIndex = 0;
    cell.style.setProperty('--glow', a.glow);
    cell.innerHTML =
      '<div class="tile">'+
        '<div class="skin" style="background:'+a.bg+'"></div>'+
        '<div class="sheen"></div>'+
        '<div class="art"><div class="logo">'+LOGO[a.logo]+'</div></div>'+
      '</div>'+
      '<div class="label">'+a.name+'</div>';
    cell.addEventListener('click', function(){ focusTile(indexOfCell(cell)); launch(a); });
    grid.appendChild(cell);
  })(APPS[i]);
}

var cells = grid.querySelectorAll('.cell');
var cur = 0;

function indexOfCell(el){
  for(var k=0;k<cells.length;k++){ if(cells[k]===el) return k; }
  return 0;
}
function cols(){
  var tpl = getComputedStyle(grid).getPropertyValue('grid-template-columns');
  var n = tpl.split(' ').length;
  return n > 0 ? n : 5;
}
function focusTile(n){
  if(n < 0) n = 0;
  if(n > cells.length-1) n = cells.length-1;
  cur = n;
  for(var k=0;k<cells.length;k++){ cells[k].className = 'cell'; }
  cells[cur].className = 'cell sel';
  try{ cells[cur].focus(); }catch(e){}
}
function launch(a){
  try{
    if(window.tizen && tizen.application && tizen.application.launch){
      tizen.application.launch(a.id, function(){}, function(err){ flash("Couldn’t open "+a.name); });
      return;
    }
  }catch(e){}
  flash("Launch → "+a.name+"  ("+a.id+")");   /* browser preview fallback */
}
var flashNode = document.getElementById('flash');
var flashTimer = null;
function flash(msg){
  flashNode.textContent = msg;
  flashNode.style.opacity = '1';
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ flashNode.style.opacity = '0'; }, 1700);
}

/* ---- remote / keyboard navigation ---- */
document.addEventListener('keydown', function(e){
  var c = cols();
  var code = e.keyCode;
  if(code === 37){ focusTile(cur-1); }           /* Left  */
  else if(code === 39){ focusTile(cur+1); }       /* Right */
  else if(code === 38){ focusTile(cur-c); }       /* Up    */
  else if(code === 40){ focusTile(cur+c); }       /* Down  */
  else if(code === 13){ launch(APPS[cur]); }      /* Enter / OK */
  else if(code === 10009){ /* Tizen RETURN / Back -> no-op on home */ }
  else { return; }
  e.preventDefault();
});
/* register common Tizen remote keys, if present */
try{
  if(window.tizen && tizen.tvinputdevice){
    var keys = ['0','1','2','3','4','ColorF0Red','ColorF1Green'];
    for(var j=0;j<keys.length;j++){ try{ tizen.tvinputdevice.registerKey(keys[j]); }catch(_){} }
  }
}catch(e){}

/* ---- live clock + greeting ---- */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function tick(){
  var d = new Date();
  var h = d.getHours();
  var m = d.getMinutes();
  var ap = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if(h12 === 0){ h12 = 12; }
  document.getElementById('time').textContent = h12 + ':' + pad2(m) + ' ' + ap;
  document.getElementById('date').textContent =
    d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
  document.getElementById('greet').textContent =
    h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
}
tick();
setInterval(tick, 10000);

/* ---- boot -> home handoff (total ~5s) ---- */
setTimeout(function(){ document.getElementById('home').className = 'show'; }, 4300);
setTimeout(function(){
  document.getElementById('home').className = 'show';
  document.getElementById('intro').className = 'done';
  focusTile(0);
}, 4700);
</script>
</body>
</html>
